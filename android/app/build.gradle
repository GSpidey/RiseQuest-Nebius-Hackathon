apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    entryFile = file("../../index.js")
    autolinkLibrariesWithApp()
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file(findProperty('risequestKeystoreProperties') ?: 'keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
        if (!signingProperties.getProperty(name)) throw new GradleException("Missing signing property: $name")
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace 'com.risequest.app'
    defaultConfig {
        applicationId 'com.risequest.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 22
        versionName "1.2.4"
    }
    // Retain the existing direct/store billing distinction without changing app identity.
    flavorDimensions 'distribution'
    productFlavors {
        direct {
            dimension 'distribution'
            buildConfigField 'String', 'RISEQUEST_DISTRIBUTION', '"direct"'
        }
        play {
            dimension 'distribution'
            buildConfigField 'String', 'RISEQUEST_DISTRIBUTION', '"play"'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (signingPropertiesFile.exists()) {
            release {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            // An absent release key produces an unsigned artifact, never a debug-signed release.
            if (signingPropertiesFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation("com.google.mlkit:text-recognition:16.0.1")
    implementation("androidx.health.connect:connect-client:1.1.0")
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation 'io.github.react-native-community:jsc-android:2026004.+'
    }
}

