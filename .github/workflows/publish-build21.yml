name: Publish verified Build 21 judging APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-build21.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify the owner-supplied Android build
        env:
          APK_URL: https://risequest-api.goldenepics.com/uploads/apk/release-703bd4b1-7691-40a2-b626-eacff363cc43/RiseQuest-1.2.4-build21.apk
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 "$APK_URL" --output RiseQuest-1.2.4-build21.apk
          echo "6bb05b78ed9537e876e37602ccf64366d81336ac469355885c1e1ee1c2bbfbc2  RiseQuest-1.2.4-build21.apk" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          unzip -tq RiseQuest-1.2.4-build21.apk
      - name: Publish the judging download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=hackathon-build21-20261024
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; preserving its assets."
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          ## RiseQuest 1.2.4 — Build 21

          Download the Android APK below to try RiseQuest's personalized morning support, quests, wellbeing tools and AI companions. This file matches the owner's supplied Build 21 APK byte-for-byte.

          ### Try RiseQuest

          1. Install the APK on Android, preserving your existing installation and app data.
          2. Register or sign in and choose your onboarding preferences.
          3. Open **Meet your companion** and select a character. Sol is one of several companions.
          4. Discuss a task by text or voice, review a proposed action and confirm it.
          5. Try the floating companion while using other app screens, and explore alarms, wake-up messages, quests and daily routines.

          Voice conversations and supported in-app actions are available in this build. Broader, whole-app hands-free navigation is planned for a future update.

          Online AI features use the hosted service and the displayed RisePoints allowance or cost. NVIDIA Nemotron through Nebius Token Factory powers the documented task-breakdown, coaching and wake-up generation paths.

          ### Build verification

          Package: `com.risequest.app`. Version: `1.2.4`. Build: `21`.
          SHA-256: `6bb05b78ed9537e876e37602ccf64366d81336ac469355885c1e1ee1c2bbfbc2`.

          The release workflow verifies the SHA-256 and APK archive before publication. The APK was supplied as a built artifact; the public source snapshot is dated October 11. Current source synchronization remains part of submission preparation.

          This GitHub Release download has no scheduled expiration.
          NOTES
          gh release create "$tag" --draft --prerelease --title "RiseQuest Android judging build — 1.2.4 Build 21" --notes-file release-notes.md
          gh release upload "$tag" RiseQuest-1.2.4-build21.apk SHA256SUMS.txt
          gh release edit "$tag" --draft=false --latest=false
