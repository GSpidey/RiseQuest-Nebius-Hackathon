name: Publish verified Build 17 judging APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-build17.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify the recorded Android build
        env:
          APK_URL: https://risequest-api.goldenepics.com/uploads/apk/release-51df90b7-5b74-4779-8820-450f10666274/RiseQuest-1.2.3-build17.apk
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 "$APK_URL" --output RiseQuest-1.2.3-build17.apk
          echo "70b8b4c952fb86674185c8056ed718acde58012cfec741dc15e9c4b7b3f915fe  RiseQuest-1.2.3-build17.apk" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          unzip -tq RiseQuest-1.2.3-build17.apk
      - name: Publish a separate judging release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=hackathon-build17-20261024
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; preserving its assets."
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          ## RiseQuest 1.2.3 — Build 17
          
          This is the exact Android APK supplied for the new real-device demonstration. It was downloaded and SHA-256 verified before publication. The developer reports installing and recording this build successfully on an Android device.
          
          ### Try the demonstrated workflow
          
          1. Install the attached APK on Android. Preserve existing app data; do not uninstall a working installation just to test.
          2. Register or sign in with your own test account and complete the preference onboarding.
          3. Open Sol via **Meet your companion**. Ask: "I need to arrange my workspace", then request small steps.
          4. Review the proposed quest, confirm creation, and inspect it in Quest Center.
          5. Try an AI wake-up message in alarm setup, and inspect the cognitive preferences and daily routine tools.
          
          Online AI features require the hosted service and internet access. Generation uses the displayed RisePoints cost. No purchases are needed for this walkthrough. Review generated steps before acting.
          
          ### Source and evaluation limits
          
          This release distributes the already-built APK; it does not claim to rebuild it from this repository. The public app/backend snapshot currently dates from October 11 and predates the Build 17 companion UI. Synchronizing that newer source remains part of submission preparation.
          
          The public snapshot documents NVIDIA Nemotron 3 Nano 30B A3B through Nebius Token Factory for quest breakdowns, coaching and wake-up messages. RiseQuest offers everyday productivity and wellbeing support, not medical diagnosis or treatment.
          
          APK SHA-256: `70b8b4c952fb86674185c8056ed718acde58012cfec741dc15e9c4b7b3f915fe`.
          
          Existing judging releases are retained.
          NOTES
          gh release create "$tag" --draft --prerelease --title "RiseQuest Android judging build — 1.2.3 Build 17" --notes-file release-notes.md
          gh release upload "$tag" RiseQuest-1.2.3-build17.apk SHA256SUMS.txt
          gh release edit "$tag" --draft=false --latest=false
